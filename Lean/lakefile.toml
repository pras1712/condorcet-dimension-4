name = "condorcet"
version = "1.0.0"
defaultTargets = ["Condorcet"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Rectangle"

[[input_file]]
name = "pairMenus"
path = "pair-menus.json"

[[lean_lib]]
name = "Checker"
needs = ["@/pairMenus"]

[[lean_lib]]
name = "Elections"

[[lean_lib]]
name = "RowMenus"

[[lean_lib]]
name = "WeightedRows"

[[lean_lib]]
name = "LiteralWords"

[[lean_lib]]
name = "Condorcet"
